name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pin the floor from pubspec.yaml as well as stable: development
        # happens on a much newer SDK, so this is the only check that the
        # declared floor actually works.
        sdk: ['3.10.0', stable]
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: dart analyze --fatal-infos
      # Formatter output drifts across SDK versions. Check it once, on the
      # declared floor, so the two matrix cells cannot disagree.
      - if: matrix.sdk == '3.10.0'
        run: dart format --output=none --set-exit-if-changed .
      - run: dart test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      # `dart doc --validate-links` exits 0 when it only emits warnings.
      - name: dart doc
        run: |
          set -euo pipefail
          dart doc --validate-links 2>&1 | tee "${RUNNER_TEMP}/dartdoc.log"
          grep -q 'Found 0 warnings and 0 errors' "${RUNNER_TEMP}/dartdoc.log"

  publish-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart pub publish --dry-run
